[project]
name = "agents"
version = "0.1.0"
description = "A delegation tree for coding agents: a planner splits work, cheap leaves do it, results merge back up."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
agents = "agents.cli:main"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
extraPaths = ["tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: runs real models and costs money; opt in with `-m live`"]
addopts = "-m 'not live'"
